version: '3.9'

# ==============================================================================
# ArogyaGPT - Docker Compose (Production)
# Services: FastAPI, Celery Worker, Flower, PostgreSQL, Redis, Nginx
# ==============================================================================

services:

  # ============================================================================
  # FastAPI Application
  # ============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: arogyagpt_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://arogyagpt:arogyagpt_secret@postgres:5432/arogyagpt
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
    volumes:
      - api_uploads:/app/data/uploads
      - api_faiss:/app/data/faiss_index
      - api_audio:/app/data/audio
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arogyagpt_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # Celery Worker (Report Processing Pipeline)
  # ============================================================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
  
      target: production
    container_name: arogyagpt_celery
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker --loglevel=info --queues=reports,emails,voice --concurrency=2 --max-tasks-per-child=100
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://arogyagpt:arogyagpt_secret@postgres:5432/arogyagpt
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
    volumes:
      - api_uploads:/app/data/uploads
      - api_faiss:/app/data/faiss_index
      - api_audio:/app/data/audio
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arogyagpt_network

  # ============================================================================
  # Celery Beat (Scheduled Tasks)
  # ============================================================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: arogyagpt_beat
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app beat --loglevel=info --scheduler=celery.schedulers:PersistentScheduler
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/3
    depends_on:
      - redis
    networks:
      - arogyagpt_network

  # ============================================================================
  # Flower - Celery Monitoring UI
  # ============================================================================
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: arogyagpt_flower
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app flower --port=5555 --address=0.0.0.0
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/3
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - arogyagpt_network

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: arogyagpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arogyagpt
      POSTGRES_PASSWORD: arogyagpt_secret
      POSTGRES_DB: arogyagpt
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - arogyagpt_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U arogyagpt -d arogyagpt" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Redis (Cache + Message Broker + Session Store)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: arogyagpt_redis
    restart: unless-stopped
    command: >
      redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - arogyagpt_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Nginx - Reverse Proxy
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: arogyagpt_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - api_audio:/var/www/audio:ro
      - nginx_logs:/var/log/nginx
      # - ./docker/ssl:/etc/nginx/ssl:ro  # Uncomment for SSL
    depends_on:
      - api
    networks:
      - arogyagpt_network

# ==============================================================================
# Networks
# ==============================================================================
networks:
  arogyagpt_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_uploads:
    driver: local
  api_faiss:
    driver: local
  api_audio:
    driver: local
  api_logs:
    driver: local
  nginx_logs:
    driver: local
