services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: arogyagpt_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the project .env file}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the project .env file}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in the project .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in the project .env file}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    volumes:
      - api_uploads:/app/data/uploads
      - api_faiss:/app/data/faiss_index
      - api_audio:/app/data/audio
      - api_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arogyagpt_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the project .env file}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - arogyagpt_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: arogyagpt_celery
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker --loglevel=info
      --queues=reports,emails,voice --concurrency=2 --max-tasks-per-child=100
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the project .env file}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    volumes:
      - api_uploads:/app/data/uploads
      - api_faiss:/app/data/faiss_index
      - api_audio:/app/data/audio
      - api_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arogyagpt_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: arogyagpt_beat
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app beat --loglevel=info
      --scheduler=celery.schedulers:PersistentScheduler
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the project .env file}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - arogyagpt_network

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: arogyagpt_flower
    restart: unless-stopped
    command: celery -A app.workers.celery_app flower --port=5555 --address=0.0.0.0
    environment:
      CELERY_BROKER_URL: redis://redis:6379/3
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - arogyagpt_network

  postgres:
    image: postgres:16-alpine
    container_name: arogyagpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arogyagpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
      POSTGRES_DB: ${POSTGRES_DB:-arogyagpt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - arogyagpt_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: arogyagpt_redis
    restart: unless-stopped
    command: >
      redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
      --appendonly yes --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    networks:
      - arogyagpt_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: arogyagpt_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - arogyagpt_network

networks:
  arogyagpt_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  api_uploads:
  api_faiss:
  api_audio:
  api_logs:
